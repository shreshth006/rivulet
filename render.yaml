# Render blueprint: the sync server with accounts, the notebook app and the
# admin console, from this repository's Dockerfile.
#
#   Render dashboard -> New -> Blueprint -> pick this repository, or open
#   https://render.com/deploy?repo=https://github.com/shreshth006/rivulet
#
# The admin and demo logins are given as scrypt hashes, so neither git nor
# Render's configuration holds a plaintext password. For your own deployment,
# replace them with hashes of your own passwords:
#
#   node apps/cli/hash-password.js      (type the password, press enter)
#
# The free plan has no persistent disk: /data is reset whenever the service
# restarts or redeploys, and the admin and demo accounts (with the demo's
# sample notebook) are recreated from these variables on every start. Attach a
# disk at /data on a paid plan to keep everything.
services:
  - type: web
    name: rivulet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    autoDeploy: true
    envVars:
      # The Dockerfile listens on 8787; this tells Render where to route.
      - key: PORT
        value: "8787"
      # Added to the image's own flags (--open-schema, so Android rooms work too).
      - key: RIVULET_FLAGS
        value: --demo --accounts --trust-proxy
      - key: RIVULET_ADMIN_USER
        value: admin
      - key: RIVULET_ADMIN_PASSWORD_HASH
        value: scrypt$16384$8$1$jfNVOYGgqQgV_RMUWj39Pg$mtluRGV6qs6vgXQsp5v__6_0-Mi9CxkvypSDYwx44bo
      - key: RIVULET_DEMO_USER
        value: demo
      - key: RIVULET_DEMO_PASSWORD_HASH
        value: scrypt$16384$8$1$2uc71EnOEgYUHJVPpVfy5Q$WC1lW5JHgbGh0fwxIg0vKqZPSr69VO7FIyUzMwO1qlg
